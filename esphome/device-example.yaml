# Device stub for one ESP32-CAM (plan §1). Copy this file into HA's ESPHome Device Builder (or keep it next to
# `watermeter-cam.yaml` for local testing) and put the secrets in its `secrets.yaml` (see secrets.example.yaml).
# Real secrets never go into this file or into git.

substitutions:
  name: watermeter-cam

esphome:
  name: ${name}
  friendly_name: Water meter camera

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

packages:
  # In HA's ESPHome Device Builder: the package from the public release repo (`main` = the latest release).
  watermeter: github://eriktack/watermeter-addon/esphome/watermeter-cam.yaml@main
  # Local testing with the file next to this one instead:
  # watermeter: !include watermeter-cam.yaml
