# Copy to `secrets.yaml` next to the device stub and fill in your own values. Never commit secrets.yaml.
# The API key must be 32 bytes, base64-encoded (ESPHome can generate one: `esphome wizard`, or `openssl rand -base64 32`).
# The key below is a placeholder only; a device with it would not be secure.

wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"
api_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
