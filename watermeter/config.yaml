name: Watermeter
# The version below is a placeholder: the real one is "version" in pyproject.toml, written in when the add-on is
# published (tools/publish_addon.py, tools/release.py). Never edit it.
version: "0.1.6"
slug: watermeter
description: Reads a water meter with an ESP32-CAM, checks the reading and publishes it to Home Assistant over MQTT
url: https://github.com/eriktack/watermeter-addon
arch:
  - amd64
init: false
startup: application
boot: auto
services:
  - mqtt:need
ingress: true
ingress_port: 8099
panel_icon: mdi:water
panel_title: Water meter
options:
  esphome_host: ""
  esphome_port: 6053
  esphome_encryption_key: ""
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  log_level: info
  capture_interval_s: 60
  capture_frames: 3
  capture_settle_s: 1.0
  light_brightness_pct: 100
  keep_accepted_days: 7
  keep_rejected_days: 30
  model: haverland/dig-class11_1910_s2_q.tflite
  min_digit_confidence: 0.5
  min_mark_score: 0.6
  reject_patterns:
    - "000400.000"
  direction: up
  max_rate_m3h: 5.0
  rate_slack_l: 1
  confirm_readings: 3
  min_confidence: 0.5
  flow_check: false
  flow_check_min_increase_l: 5
schema:
  esphome_host: str
  esphome_port: port
  esphome_encryption_key: password
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  log_level: list(debug|info|warning|error)
  capture_interval_s: int(10,3600)
  capture_frames: int(1,9)
  capture_settle_s: float(0,10)
  light_brightness_pct: int(1,100)
  keep_accepted_days: int(1,365)
  keep_rejected_days: int(1,365)
  model: list(haverland/dig-class11_1910_s2_q.tflite|haverland/dig-class11_1900_s2_q.tflite|haverland/dig-class11_1701_s2.tflite|nliaudat/v16_10cls_RGB/digit_recognizer_v16.onnx)
  min_digit_confidence: float(0,1)
  min_mark_score: float(0,1)
  reject_patterns:
    - match(^[0-9*.]+$)
  direction: list(up|both)
  max_rate_m3h: float(0.1,100)
  rate_slack_l: int(0,1000)
  confirm_readings: int(1,20)
  min_confidence: float(0,1)
  flow_check: bool
  flow_check_min_increase_l: int(0,1000)
